# IW61x dashboard: static web app from ./web, API proxied to the api service.
upstream iw_api {
    server api:8003;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/x-ndjson text/markdown text/plain image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # ── Static web app ──
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;         # revalidate (ETag) — new code shows up after deploy
        add_header X-Content-Type-Options nosniff always;
    }
    location /vendor/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;   # versioned file names
        add_header X-Content-Type-Options nosniff always;
    }

    # Addresses of the pre-2.0 dashboard (bookmarks): the API redirects them to the matching page.
    location ~ ^/(solo_pixi_dashboard|work-orders|fail-list|fail-analysis|bt-analysis|wifi-analysis|advanced|upload|admin|alignment)\.html$ {
        proxy_pass http://iw_api;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    # ── API ──
    location /api/ {
        proxy_pass http://iw_api;
        include /etc/nginx/conf.d/proxy_common.inc;
        proxy_read_timeout 120s;
    }
    location ~ ^/(health|docs|redoc|openapi\.json)$ {
        proxy_pass http://iw_api;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    # Uploads: large bodies, streamed to the API.
    location = /api/log-upload/analyze {
        proxy_pass http://iw_api;
        include /etc/nginx/conf.d/proxy_common.inc;
        client_max_body_size 512m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    # NDJSON streams (upload progress, AI chat, AI report): no buffering, long reads.
    location ~ ^/api/(log-upload/(commit|chat)|reports/[^/]+/(generate|ask))$ {
        proxy_pass http://iw_api;
        include /etc/nginx/conf.d/proxy_common.inc;
        proxy_buffering off;
        proxy_read_timeout 300s;
        gzip off;
    }
}
