<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload - IW Solo PIXI</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/styles.css">
  <script defer src="/static/common.js"></script>
  <script defer src="/static/ai.js"></script>
</head>
<body data-page="upload">
  <aside class="sidebar"></aside>
  <main class="workspace">
    <header class="topbar"><div><p class="eyebrow">Ingestion</p><h1>Upload Logs</h1></div></header>
    <section id="status" class="status"></section>
    <section class="panel">
      <div class="panel-head"><h2>Browser Upload</h2><span>.txt or safe .zip</span></div>
      <form id="uploadForm" class="form-grid">
        <label>Work order override<input name="work_order" placeholder="optional, e.g. 5101-260715003"></label>
        <label>Log files<input name="files" type="file" accept=".txt,.zip" multiple required></label>
        <button class="button primary" type="submit">Upload</button>
      </form>
      <pre id="uploadResult" class="codebox"></pre>
    </section>
  </main>
</body>
</html>
