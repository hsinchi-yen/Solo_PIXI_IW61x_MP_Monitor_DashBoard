services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pixi_test}
      POSTGRES_USER: ${POSTGRES_USER:-pixi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pixipass}
    ports:
      - "${IW_DB_PORT:-5434}:5432"
    restart: unless-stopped
    volumes:
      - iw-pixi-pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - iw-pixi-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pixi}:${POSTGRES_PASSWORD:-pixipass}@postgres:5432/${POSTGRES_DB:-pixi_test}
      APP_VERSION: ${APP_VERSION:-2.0.0}
      APP_TZ: ${APP_TZ:-Asia/Taipei}
      TZ: ${APP_TZ:-Asia/Taipei}
      ADMIN_USER: ${ADMIN_USER:-pixi}
      ADMIN_PASS: ${ADMIN_PASS:-pixipass}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen3.8-27B-UD-Q6_K_L}
      LLM_ENABLE_THINKING: ${LLM_ENABLE_THINKING:-false}
      LLM_REPORT_MAX_TOKENS: ${LLM_REPORT_MAX_TOKENS:-1536}
      STATS_REFRESH_SEC: ${STATS_REFRESH_SEC:-300}
      REPORT_AUTO: ${REPORT_AUTO:-true}
      REPORT_DAILY_AT: ${REPORT_DAILY_AT:-18:00}
      DB_POOL_MAX: ${DB_POOL_MAX:-8}
      UPLOAD_TMP_DIR: /tmp/iw_uploads
    ports:
      - "${IW_API_PORT:-8003}:8003"
    volumes:
      # Uploads between analyze and commit; shared by both workers, kept across restarts.
      - iw-pixi-uploads:/tmp/iw_uploads
    networks:
      - iw-pixi-net
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${IW_WEB_PORT:-8004}:80"
    restart: unless-stopped
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./web:/usr/share/nginx/html:ro
    networks:
      - iw-pixi-net
    depends_on:
      api:
        condition: service_healthy

volumes:
  iw-pixi-pgdata:
  iw-pixi-uploads:

networks:
  iw-pixi-net:
