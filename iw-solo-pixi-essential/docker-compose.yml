services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pixi_test}
      POSTGRES_USER: ${POSTGRES_USER:-pixi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pixipass}
    ports:
      - "${IW_DB_PORT:-5434}:5432"
    volumes:
      - iw-pixi-pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - iw-pixi-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    command: uvicorn app:app --host 0.0.0.0 --port 8003 --workers 2
    ports:
      - "${IW_API_PORT:-8003}:8003"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pixi}:${POSTGRES_PASSWORD:-pixipass}@postgres:5432/${POSTGRES_DB:-pixi_test}
      LLM_API_BASE: ${LLM_API_BASE:-http://10.20.30.23:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen3.6-35B-A3B-Q6_K}
    volumes:
      - ./api/app.py:/app/app.py
      - ./api/db.py:/app/db.py
      - ./api/query_service.py:/app/query_service.py
      - ./api/upload_routes.py:/app/upload_routes.py
      - ./api/admin_routes.py:/app/admin_routes.py
      - ./api/reference_routes.py:/app/reference_routes.py
      - ./api/ai_summary_helper.py:/app/ai_summary_helper.py
      - ./parsers:/app/parsers
      - ./ingestion:/app/ingestion
      - ./static:/app/static
      - ./schema.sql:/app/schema.sql
    networks:
      - iw-pixi-net
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${IW_WEB_PORT:-8004}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - iw-pixi-net
    depends_on:
      api:
        condition: service_healthy

volumes:
  iw-pixi-pgdata:

networks:
  iw-pixi-net:
